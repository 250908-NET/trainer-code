name: Docker Build Backend

on: 
    workflow_dispatch:
    push:
        paths:
           - backend/app/**
           - backend/shared/**

env:
    AWS_REGION: us-west-2
    ECR_REPOSITORY: cde/backendv2
 
jobs:
    Build:
        runs-on: ubuntu-latest

        env:
            TAG: |-
                ${{ 
                   github.ref_name ==  'dev' && 'dev'
                || github.ref_name ==  'demo' && 'demo'
                || github.ref_name == 'main' && 'prod'
                || 'NONE'
                }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Docker Setup Buildx
              uses: docker/setup-buildx-action@v3.11.1
              
            - name: Build Docker Image
              id: build-image
              run: docker build --file ./backend/Dockerfile.backend --tag ${{ env.ECR_REPOSITORY }}:${{env.TAG}} --tag ${{ env.ECR_REPOSITORY }}:${{ github.sha }} ./

            - name: Configure AWS credentials
              if: env.TAG != 'NONE'
              id: aws-credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Amazon ECR Login
              if: env.TAG != 'NONE'
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Install jq
              if: env.TAG != 'NONE'
              run: sudo apt-get update && sudo apt-get install -y jq

            - name: Cleanup old images
              if: env.TAG != 'NONE'
              run: |
                  ECR_REGISTRY=$(aws ecr describe-registry --query 'registryId' --output text).dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

                  IMAGES=$(aws ecr describe-images \
                      --repository-name ${{ env.ECR_REPOSITORY }} \
                      --region ${{ env.AWS_REGION }} | jq -r '.imageDetails')

                  echo "All Images: $IMAGES"

                  ONLY_COMMIT_TAGGED_IMAGES=$(jq -r '
                      map(
                          select(
                              has("imageTags") and
                              (all(.imageTags[]; test("^(dev|demo|prod)$") | not)) and
                              (all(.imageTags[]; test("^[a-f0-9]{7,}$")))
                          )
                      )
                  ' <<< "$IMAGES")

                  echo "Commit Tag Only Images: $ONLY_COMMIT_TAGGED_IMAGES"

                  IMAGE_DIGESTS=$(jq -r '[.[] | "imageDigest=\(.imageDigest)"] | join(" ")' <<< "$ONLY_COMMIT_TAGGED_IMAGES")

                  echo "Removing Images: $IMAGE_DIGESTS"
                  
                  if [ -n "$IMAGE_DIGESTS" ]; then
                      aws ecr batch-delete-image \
                          --repository-name ${{ env.ECR_REPOSITORY }} \
                          --image-ids $IMAGE_DIGESTS \
                          --region ${{ env.AWS_REGION }}
                  else
                      echo "No images found that are tagged only with commit hashes."
                  fi                

            - name: Push image to Amazon ECR
              if: env.TAG != 'NONE'
              id: push-image
              run: |
                  ECR_REGISTRY=$(aws ecr describe-registry --query 'registryId' --output text).dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
                  docker tag ${{ env.ECR_REPOSITORY }}:${{env.TAG}} $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{env.TAG}}
                  docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{env.TAG}}

                  docker tag ${{ env.ECR_REPOSITORY }}:${{ github.sha }} $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
                  docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
