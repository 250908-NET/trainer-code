<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>JS Button Function</title>
    </head>
    <body>
        <h1>onclick Demo </h1>
        <button onclick="sayHello()">Click Me</button>

        <script> 
            function sayHello(){
                alert("Hello from onclick");
                console.log("Button was clicked;")
            }
        </script>

    </body>
</html>
