<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>JS Calculator</title>
        <link rel="stylesheet" type="text/css" media="screen" href="main.css">
      </head>
      <body>
        <h1>Calculater</h1>
        
        <div style="border: 2px solid #ccc; border-radius: 8px; padding: 1rem; width: fit-content; margin-bottom: 20px;">
          <div style="margin-bottom: 5px;">

            <input type="number" id="num1" placeholder="First number">
            <input type="number" id="num2" placeholder="Second number">
          </div>
          <div>

            <button id="addBtn">Add</button>
            <button id="subtractBtn">Subtract</button>
            <button id="multiplyBtn">Multiply</button>
            <button id="divideBtn">Divide</button>
          </div>
          
          <p id="result"></p><br>
        </div>
      </body>
      <script src="script.js"></script>
</html>
